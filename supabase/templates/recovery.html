<!-- Supabase > Authentication > Emails > Reset password şablonu. Konu: İzlek şifre yenileme -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #14201b; line-height: 1.6">
  <p style="font-size: 20px; font-weight: bold; color: #0f6b4f; margin: 0 0 16px">İzlek</p>
  <p>Merhaba,</p>
  <p>İzlek hesabınız için şifre yenileme isteği aldık. Yeni şifrenizi belirlemek için aşağıdaki düğmeye basın.</p>
  <p style="margin: 24px 0">
    <a href="{{ .SiteURL }}/sifre-yenile?token_hash={{ .TokenHash }}"
       style="background: #0f6b4f; color: #ffffff; padding: 12px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; display: inline-block">Yeni şifre belirleyin</a>
  </p>
  <p style="color: #5b6b63; font-size: 14px">Bağlantı 1 saat geçerlidir ve bir kez kullanılır. Bu isteği siz yapmadıysanız e-postayı yok sayabilirsiniz, şifreniz değişmez.</p>
</div>
