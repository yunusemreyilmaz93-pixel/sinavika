      <header class="pt-safe sticky top-0 z-40 border-b border-transparent">
        <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 flex h-16 items-center gap-2">
          <a aria-label="Yolumnet ana sayfa" class="-ml-1 shrink-0 rounded-lg p-1" href="/">

            <div class="mt-8 flex flex-col gap-2.5 sm:flex-row">
