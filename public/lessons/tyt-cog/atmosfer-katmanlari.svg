<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 332" width="660" height="332" font-family="Figtree, system-ui, -apple-system, Segoe UI, sans-serif"><rect width="660" height="332" fill="#eef2ec"/><text x="330" y="24" font-size="19.5" fill="#0e1a21" font-weight="800" text-anchor="middle">Atmosferin katmanları (ölçekli değil)</text><rect x="40" y="44" width="580" height="52" fill="#fbe4e2" stroke="#c93b34" stroke-width="3"/><text x="60" y="68" font-size="18.2" fill="#c93b34" font-weight="800" text-anchor="start">Ekzosfer</text><text x="60" y="86" font-size="14.3" fill="#56666d" font-weight="700" text-anchor="start">500 km üstü</text><text x="600" y="77" font-size="15.6" fill="#0e1a21" font-weight="700" text-anchor="end">Gazlar uzaya karışır</text><rect x="40" y="100" width="580" height="52" fill="#fdf0d5" stroke="#b7740a" stroke-width="3"/><text x="60" y="124" font-size="18.2" fill="#b7740a" font-weight="800" text-anchor="start">Termosfer</text><text x="60" y="142" font-size="14.3" fill="#56666d" font-weight="700" text-anchor="start">80 ile 500 km</text><text x="600" y="133" font-size="15.6" fill="#0e1a21" font-weight="700" text-anchor="end">Sıcaklık artar, radyo dalgaları, kutup ışığı</text><rect x="40" y="156" width="580" height="52" fill="#e1eafc" stroke="#2456c4" stroke-width="3"/><text x="60" y="180" font-size="18.2" fill="#2456c4" font-weight="800" text-anchor="start">Mezosfer</text><text x="60" y="198" font-size="14.3" fill="#56666d" font-weight="700" text-anchor="start">50 ile 80 km</text><text x="600" y="189" font-size="15.6" fill="#0e1a21" font-weight="700" text-anchor="end">En soğuk katman, göktaşları yanar</text><rect x="40" y="212" width="580" height="52" fill="#dcf0e6" stroke="#0f6b4f" stroke-width="3"/><text x="60" y="236" font-size="18.2" fill="#0f6b4f" font-weight="800" text-anchor="start">Stratosfer</text><text x="60" y="254" font-size="14.3" fill="#56666d" font-weight="700" text-anchor="start">12 ile 50 km</text><text x="600" y="245" font-si