<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285" font-family="Figtree, system-ui, -apple-system, Segoe UI, sans-serif"><rect width="640" height="285" fill="#eef2ec"/><text x="320" y="28" font-size="19.5" fill="#0e1a21" font-weight="800" text-anchor="middle">Fonksiyon: her girdiye tam bir çıktı</text><ellipse cx="160" cy="150" rx="75" ry="90" fill="#dcf0e6" stroke="#0f6b4f" stroke-width="3"/><text x="160" y="50" font-size="18.2" fill="#0f6b4f" font-weight="800" text-anchor="middle">A (tanım kümesi)</text><ellipse cx="480" cy="150" rx="75" ry="90" fill="#e1eafc" stroke="#2456c4" stroke-width="3"/><text x="480" y="50" font-size="18.2" fill="#2456c4" font-weight="800" text-anchor="middle">B (değer kümesi)</text><circle cx="160" cy="100" r="6" fill="#0f6b4f"/><text x="138" y="105" font-size="16.9" fill="#0f6b4f" font-weight="800" text-anchor="middle">1</text><circle cx="160" cy="150" r="6" fill="#0f6b4f"/><text x="138" y="155" font-size="16.9" fill="#0f6b4f" font-weight="800" text-anchor="middle">2</text><circle cx="160" cy="200" r="6" fill="#0f6b4f"/><text x="138" y="205" font-size="16.9" fill="#0f6b4f" font-weight="800" text-anchor="middle">3</text><circle cx="480" cy="100" r="6" fill="#2456c4"/><text x="502" y="105" font-size="16.9" fill="#2456c4" font-weight="800" text-anchor="middle">3</text><circle cx="480" cy="150" r="6" fill="#2456c4"/><text x="502" y="155" font-size="16.9" fill="#2456c4" font-weight="800" text-anchor="middle">5</text><circle cx="480" cy="200" r="6" fill="#2456c4"/><text x="502" y="205" font-size="16.9" fill="#2456c4" font-weight="800" text-anchor="middle">7</text><line x1="168" y1="100" x2="472" y2="100" stroke="#0e1a21" stroke-width="2.5"/><line x1="168" y1="150" x2="472" y2="150" stroke="#0e1a21" stroke-width="2.5"/><line x1="168" y1="200" x2="472" y2="200" stroke="#0e1a21" stroke-width="2.5"/><text x="320" y="130" font-size="19.5" fill="#0e1a21" font-weight="800" text-anchor="middle">f(x) = 2x + 1</text><text x="320" y="262" font-size="15.6" fill="#56666d" font-weight="600" text-anchor="middle">1 → 3, 2 → 5, 3 → 7. A'nın her elemanı bir kez eşleniyor</text></svg>