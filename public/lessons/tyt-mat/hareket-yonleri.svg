<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="Figtree, system-ui, -apple-system, Segoe UI, sans-serif"><rect width="640" height="390" fill="#eef2ec"/><text x="320" y="28" font-size="19.5" fill="#0e1a21" font-weight="800" text-anchor="middle">Karşılıklı hareket: yaklaşma hızı toplanır</text><line x1="60" y1="96" x2="580" y2="96" stroke="#0e1a21" stroke-width="3"/><rect x="80" y="60" width="70" height="36" rx="8" fill="#dcf0e6" stroke="#0f6b4f" stroke-width="2.5"/><text x="115" y="84" font-size="20.8" fill="#0f6b4f" font-weight="800" text-anchor="middle">A</text><line x1="156" y1="78" x2="210.0" y2="78.0" stroke="#0f6b4f" stroke-width="3" stroke-linecap="round"/><polygon points="216,78 206.1,82.8 206.1,73.2" fill="#0f6b4f"/><text x="190" y="54" font-size="15.6" fill="#0f6b4f" font-weight="700" text-anchor="middle">70 km/sa</text><rect x="490" y="60" width="70" height="36" rx="8" fill="#e1eafc" stroke="#2456c4" stroke-width="2.5"/><text x="525" y="84" font-size="20.8" fill="#2456c4" font-weight="800" text-anchor="middle">B</text><line x1="484" y1="78" x2="430.0" y2="78.0" stroke="#2456c4" stroke-width="3" stroke-linecap="round"/><polygon points="424,78 433.9,73.2 433.9,82.8" fill="#2456c4"/><text x="450" y="54" font-size="15.6" fill="#2456c4" font-weight="700" text-anchor="middle">50 km/sa</text><line x1="80" y1="120" x2="560" y2="120" stroke="#56666d" stroke-width="2"/><text x="320" y="142" font-size="18.2" fill="#0e1a21" font-weight="800" text-anchor="middle">720 km</text><text x="320" y="168" font-size="16.9" fill="#56666d" font-weight="700" text-anchor="middle">720 / (70 + 50) = 6 saat sonra karşılaşırlar</text><text x="320" y="226" font-size="19.5" fill="#0e1a21" font-weight="800" text-anchor="middle">Aynı yön: hızlar çıkarılır</text><line x1="60" y1="286" x2="580" y2="286" stroke="#0e1a21" stroke-width="3"/><rect x="80" y="250" width="70" height="36" rx="8" fill="#dcf0e6" stroke="#0f6b4f" stroke-width="2.5"/><text x="115" y="274" font-size="20.8" fill="#0f6b4f" font-weight="800" text-anchor="middle">A</text><line x1="156" y1="268" x2="230.0" y2="268.0" stroke="#0f6b4f" stroke-width="3" stroke-linecap="round"/><polygon points="236,268 226.1,272.8 226.1,263.2" fill="#0f6b4f"/><text x="196" y="244" font-size="15.6" fill="#0f6b4f" font-weight="700" text-anchor="middle">90 km/sa</text><rect x="330" y="250" width="70" height="36" rx="8" fill="#e1eafc" stroke="#2456c4" stroke-width="2.5"/><text x="365" y="274" font-size="20.8" fill="#2456c4" font-weight="800" text-anchor="middle">B</text><line x1="406" y1="268" x2="460.0" y2="268.0" stroke="#2456c4" stroke-width="3" stroke-linecap="round"/><polygon points="466,268 456.1,272.8 456.1,263.2" fill="#2456c4"/><text x="436" y="244" font-size="15.6" fill="#2456c4" font-weight="700" text-anchor="middle">70 km/sa</text><line x1="150" y1="310" x2="330" y2="310" stroke="#56666d" stroke-width="2"/><text x="240" y="332" font-size="18.2" fill="#0e1a21" font-weight="800" text-anchor="middle">100 km</text><text x="320" y="358" font-size="16.9" fill="#56666d" font-weight="700" text-anchor="middle">A, B'yi 100 / (90 - 70) = 5 saat sonra yakalar</text></svg>