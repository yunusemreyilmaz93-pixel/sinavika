<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Figtree, system-ui, -apple-system, Segoe UI, sans-serif"><rect width="640" height="360" fill="#eef2ec"/><polygon points="180.0,90.0 90.0,250.0 430.0,250.0" fill="#ffffff" stroke="#0e1a21" stroke-width="3" stroke-linejoin="round"/><line x1="180.0" y1="90.0" x2="180.0" y2="250.0" stroke="#2456c4" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><polyline points="173.1,102.2 184.8,109.2 191.8,97.5" fill="none" stroke="#0e1a21" stroke-width="2.2"/><polyline points="194,250 194,236 180,236" fill="none" stroke="#0e1a21" stroke-width="2.2"/><text x="180" y="78" font-size="22.1" fill="#0e1a21" font-weight="800" text-anchor="middle">A</text><text x="74" y="258" font-size="22.1" fill="#0e1a21" font-weight="800" text-anchor="middle">B</text><text x="446" y="258" font-size="22.1" fill="#0e1a21" font-weight="800" text-anchor="middle">C</text><text x="180" y="276" font-size="22.1" fill="#0e1a21" font-weight="800" text-anchor="middle">H</text><text x="132" y="276" font-size="20.8" fill="#0f6b4f" font-weight="800" text-anchor="middle">p</text><text x="305" y="276" font-size="20.8" fill="#0f6b4f" font-weight="800" text-anchor="middle">q</text><text x="172" y="176" font-size="20.8" fill="#2456c4" font-weight="800" text-anchor="end">h</text><text x="120" y="164" font-size="20.8" fill="#c93b34" font-weight="800" text-anchor="end">c</text><text x="320" y="150" font-size="20.8" fill="#c93b34" font-weight="800" text-anchor="middle">b</text><text x="320" y="314" font-size="18.2" fill="#0e1a21" font-weight="800" text-anchor="middle">|BH| = p, |HC| = q, a = p + q</text><text x="120" y="342" font-size="18.2" fill="#2456c4" font-weight="800" text-anchor="middle">h² = p · q</text><text x="250" y="342" font-size="18.2" fill="#c93b34" font-weight="800" text-anchor="middle">c² = p · a</text><text x="380" y="342" font-size="18.2" fill="#c93b34" font-weight="800" text-anchor="middle">b² = q · a</text><text x="520" y="342" font-size="18.2" fill="#0f6b4f" font-weight="800" text-anchor="middle">b · c = a · h</text></svg>