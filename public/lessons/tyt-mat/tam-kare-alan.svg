<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Figtree, system-ui, -apple-system, Segoe UI, sans-serif"><rect width="720" height="330" fill="#eef2ec"/><rect x="130" y="40" width="170" height="170" rx="2" fill="#dcf0e6" stroke="#0f6b4f" stroke-width="2.5"/><rect x="300" y="40" width="90" height="170" rx="2" fill="#fdf0d5" stroke="#b7740a" stroke-width="2.5"/><rect x="130" y="210" width="170" height="90" rx="2" fill="#fdf0d5" stroke="#b7740a" stroke-width="2.5"/><rect x="300" y="210" width="90" height="90" rx="2" fill="#e1eafc" stroke="#2456c4" stroke-width="2.5"/><text x="215.0" y="133.0" font-size="31.2" fill="#0f6b4f" font-weight="800" text-anchor="middle">a²</text><text x="345.0" y="133.0" font-size="26.0" fill="#b7740a" font-weight="800" text-anchor="middle">ab</text><text x="215.0" y="263.0" font-size="26.0" fill="#b7740a" font-weight="800" text-anchor="middle">ab</text><text x="345.0" y="263.0" font-size="28.6" fill="#2456c4" font-weight="800" text-anchor="middle">b²</text><text x="215.0" y="30" font-size="20.8" fill="#0e1a21" font-weight="800" text-anchor="middle">a</text><text x="345.0" y="30" font-size="20.8" fill="#0e1a21" font-weight="800" text-anchor="middle">b</text><text x="114" y="131.0" font-size="20.8" fill="#0e1a21" font-weight="800" text-anchor="middle">a</text><text x="114" y="261.0" font-size="20.8" fill="#0e1a21" font-weight="800" text-anchor="middle">b</text><text x="555" y="130" font-size="20.8" fill="#0e1a21" font-weight="800" text-anchor="middle">(a + b)² = a² + 2ab + b²</text><text x="555" y="162" font-size="15.6" fill="#56666d" font-weight="600" text-anchor="middle">Büyük karenin alanı,</text><text x="555" y="182" font-size="15.6" fill="#56666d" font-weight="600" text-anchor="middle">dört parçanın toplamıdır</text></svg>