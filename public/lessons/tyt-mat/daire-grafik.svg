<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Figtree, system-ui, -apple-system, Segoe UI, sans-serif"><rect width="640" height="300" fill="#eef2ec"/><text x="320" y="26" font-size="19.5" fill="#0e1a21" font-weight="800" text-anchor="middle">240 öğrencinin spor tercihi (merkez açılar)</text><path d="M 190 160 L 190.0 50.0 A 110 110 0 0 1 285.3 215.0 Z" fill="#dcf0e6" stroke="#0f6b4f" stroke-width="3"/><text x="249.06293253809872" y="130.9" font-size="18.2" fill="#0f6b4f" font-weight="800" text-anchor="middle">120°</text><path d="M 190 160 L 285.3 215.0 A 110 110 0 0 1 135.0 255.3 Z" fill="#e1eafc" stroke="#2456c4" stroke-width="3"/><text x="207.65145887599192" y="230.87614135291446" font-size="18.2" fill="#2456c4" font-weight="800" text-anchor="middle">90°</text><path d="M 190 160 L 135.0 255.3 A 110 110 0 0 1 80.0 160.0 Z" fill="#fdf0d5" stroke="#b7740a" stroke-width="3"/><text x="130.93706746190128" y="199.1" font-size="18.2" fill="#b7740a" font-weight="800" text-anchor="middle">60°</text><path d="M 190 160 L 80.0 160.0 A 110 110 0 0 1 190.0 50.0 Z" fill="#fbe4e2" stroke="#c93b34" stroke-width="3"/><text x="141.77531752307743" y="116.77531752307746" font-size="18.2" fill="#c93b34" font-weight="800" text-anchor="middle">90°</text><rect x="380" y="80" width="24" height="24" rx="5" fill="#dcf0e6" stroke="#0f6b4f" stroke-width="2.5"/><text x="414" y="98" font-size="18.2" fill="#0e1a21" font-weight="700" text-anchor="start">Futbol: 120° = 80 kişi</text><rect x="380" y="120" width="24" height="24" rx="5" fill="#e1eafc" stroke="#2456c4" stroke-width="2.5"/><text x="414" y="138" font-size="18.2" fill="#0e1a21" font-weight="700" text-anchor="start">Basketbol: 90° = 60 kişi</text><rect x="380" y="160" width="24" height="24" rx="5" fill="#fdf0d5" stroke="#b7740a" stroke-width="2.5"/><text x="414" y="178" font-size="18.2" fill="#0e1a21" font-weight="700" text-anchor="start">Voleybol: 60° = 40 kişi</text><rect x="380" y="20